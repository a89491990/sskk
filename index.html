<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NexusDrop | Futuristic Crypto Airdrop Hub</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Three.js Core & Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #05070a;
            color: #eef5ff;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a6fdb;
            border-radius: 8px;
        }

        /* Canvas 3D background */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main content wrapper */
        .app-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
        }

        /* Glassmorphism header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(12px);
            background: rgba(10, 20, 30, 0.5);
            border-radius: 2rem;
            padding: 1rem 2rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #aaffff, #3a86ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .logo span {
            font-size: 0.8rem;
            color: #6c8eff;
        }

        .admin-btn {
            background: rgba(20,30,55,0.8);
            border: 1px solid #3a6eff;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .admin-btn:hover {
            background: #2a6fdb;
            box-shadow: 0 0 12px #2a6fdb;
            color: white;
        }

        /* Search + Filters */
        .filters-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            padding: 1rem 1.8rem;
            border-radius: 48px;
            border: 1px solid rgba(58,110,255,0.3);
        }
        .search-box {
            flex: 2;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 0.5rem 1rem;
            border: 1px solid #2a6fdb;
        }
        .search-box i {
            color: #3a86ff;
            margin-right: 10px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 1rem;
        }
        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-group select {
            background: #0f172ad9;
            border: 1px solid #3a6eff;
            border-radius: 32px;
            padding: 0.5rem 1rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        /* notification badge */
        .notify-bell {
            position: relative;
            cursor: pointer;
            font-size: 1.4rem;
            transition: 0.2s;
        }
        .notify-bell:hover {
            text-shadow: 0 0 8px cyan;
        }

        /* Section titles */
        .section-title {
            font-size: 1.6rem;
            margin: 2rem 0 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 5px solid #2a6fdb;
            padding-left: 1rem;
        }

        /* Cards grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }

        /* Glassmorphic 3D card */
        .airdrop-card {
            background: rgba(20, 28, 40, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(0, 255, 255, 0.25);
            padding: 1.4rem;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            transform: translateY(0) rotateX(0deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .airdrop-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #3a86ff;
            box-shadow: 0 20px 35px -10px #2a6fdb80, 0 0 15px rgba(58,134,255,0.4);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
        }
        .card-header img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #0a0f1a;
            border: 1px solid cyan;
            object-fit: cover;
        }
        .project-name {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .blockchain-badge {
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #6c8eff;
            display: inline-block;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 0.9rem;
        }
        .difficulty, .reward {
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
        }
        .status {
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 30px;
            text-align: center;
            display: inline-block;
        }
        .status.Live { background: #00c85330; color: #00e676; border: 1px solid #00e676; }
        .status.Upcoming { background: #ffb74d30; color: #ffb74d; border: 1px solid #ffb74d; }
        .status.Ended { background: #f4433630; color: #ff8a80; border: 1px solid #f44336; }
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
        }
        .join-btn {
            background: linear-gradient(90deg, #2a6fdb, #4a3aff);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .join-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 12px #3a86ff;
        }
        .bookmark {
            font-size: 1.6rem;
            cursor: pointer;
            color: #aac8ff;
            transition: 0.2s;
        }
        .bookmark.active {
            color: #ffd966;
            text-shadow: 0 0 6px gold;
        }
        /* admin panel modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0b1120e6;
            border-radius: 2rem;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            border: 1px solid cyan;
            box-shadow: 0 0 40px rgba(0,255,255,0.2);
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1a2332;
            border: 1px solid #3a6eff;
            border-radius: 28px;
            color: white;
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        /* trending featured latest */
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f212ecc;
            backdrop-filter: blur(12px);
            border-left: 5px solid #2a6fdb;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 1200;
            font-weight: 500;
            animation: fadeInOut 3s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(50px); }
            15% { opacity: 1; transform: translateX(0); }
            85% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        @media (max-width: 780px) {
            .app-wrapper { padding: 1rem; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .filters-section { flex-direction: column; align-items: stretch; border-radius: 28px; }
        }
        button { background: none; border: none; }
        .featured-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ffaa33cc;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="canvas-container"></div>
<div class="app-wrapper">
    <div class="header">
        <div class="logo">
            <h1>NEXUSDROP <i class="fas fa-cube"></i></h1>
            <span>curated airdrop intelligence</span>
        </div>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div class="notify-bell" id="notifyBell"><i class="fas fa-bell"></i> <span id="newNotifCount" style="font-size: 0.7rem;">0</span></div>
            <button class="admin-btn" id="openAdminBtn"><i class="fas fa-user-secret"></i> Admin Panel</button>
        </div>
    </div>

    <div class="filters-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search airdrop by name...">
        </div>
        <div class="filter-group">
            <select id="blockchainFilter">
                <option value="all">All Chains</option>
                <option value="Ethereum">Ethereum</option>
                <option value="Solana">Solana</option>
                <option value="BNB Chain">BNB Chain</option>
                <option value="Polygon">Polygon</option>
                <option value="Avalanche">Avalanche</option>
            </select>
            <select id="difficultyFilter">
                <option value="all">Difficulty</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>
    </div>

    <!-- Trending & Featured Section -->
    <div class="flex-row" style="justify-content: space-between; flex-wrap: wrap;">
        <div style="flex:1; min-width: 250px;">
            <div class="section-title"><i class="fas fa-fire-flame-curved"></i> Trending Airdrops</div>
            <div id="trendingContainer" class="cards-grid" style="grid-template-columns: 1fr;"></div>
        </div>
        <div style="flex:2; min-width: 300px;">
            <div class="section-title"><i class="fas fa-gem"></i> Featured Airdrops</div>
            <div id="featuredContainer" class="cards-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px,1fr));"></div>
        </div>
    </div>
    
    <div class="section-title"><i class="fas fa-clock"></i> Latest Airdrops</div>
    <div id="latestContainer" class="cards-grid"></div>
    
    <div class="section-title"><i class="fas fa-list-ul"></i> All Airdrops</div>
    <div id="allAirdropsContainer" class="cards-grid"></div>
</div>

<!-- Admin Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h2><i class="fas fa-dragon"></i> Admin Control</h2>
        <input type="text" id="adminProjectName" placeholder="Project Name">
        <input type="text" id="adminLogoUrl" placeholder="Logo URL (icon)">
        <select id="adminBlockchain">
            <option value="Ethereum">Ethereum</option>
            <option value="Solana">Solana</option>
            <option value="BNB Chain">BNB Chain</option>
            <option value="Polygon">Polygon</option>
            <option value="Avalanche">Avalanche</option>
        </select>
        <select id="adminDifficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>
        <input type="text" id="adminReward" placeholder="Reward Potential (e.g. $500 - $5000)">
        <select id="adminStatus">
            <option value="Upcoming">Upcoming</option>
            <option value="Live">Live</option>
            <option value="Ended">Ended</option>
        </select>
        <div class="modal-buttons">
            <button id="saveAirdropBtn" class="join-btn" style="background: #2a6fdb;">Add / Update</button>
            <button id="closeModalBtn" class="admin-btn">Cancel</button>
        </div>
        <p style="margin-top: 10px; font-size:12px;">* Edit: select a card first to edit, or add new.</p>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    
    // --- 3D animated hero background (floating glowing cubes) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 12);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0x111122);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0x2a6fdb, 1, 20);
    pointLight.position.set(2, 3, 4);
    scene.add(pointLight);
    const backLight = new THREE.PointLight(0xff44aa, 0.5);
    backLight.position.set(-2, 1, -5);
    scene.add(backLight);
    
    // floating torus knots and cubes
    const group = new THREE.Group();
    const geometry = new THREE.IcosahedronGeometry(0.6, 0);
    const material = new THREE.MeshStandardMaterial({ color: 0x3a86ff, emissive: 0x1a44aa, emissiveIntensity: 0.6, metalness: 0.8, roughness: 0.2 });
    const coreMesh = new THREE.Mesh(geometry, material);
    group.add(coreMesh);
    
    const ringGeo = new THREE.TorusGeometry(0.9, 0.08, 32, 100);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x0088aa });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    group.add(ring);
    scene.add(group);
    
    // additional floating cubes
    const cubes = [];
    for(let i=0;i<45;i++) {
        const size = 0.08 + Math.random()*0.1;
        const cubeMat = new THREE.MeshStandardMaterial({ color: 0x2a6fdb, emissive: 0x114477, emissiveIntensity: 0.3 });
        const cube = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), cubeMat);
        cube.position.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 10 - 5);
        cube.userData = { speed: 0.005 + Math.random() * 0.01, rotSpeed: 0.01 };
        scene.add(cube);
        cubes.push(cube);
    }
    
    let time = 0;
    function animate3D() {
        requestAnimationFrame(animate3D);
        time += 0.01;
        group.rotation.y = time * 0.5;
        group.rotation.x = Math.sin(time * 0.3) * 0.2;
        group.position.y = Math.sin(time) * 0.1;
        cubes.forEach(cube => {
            cube.rotation.x += cube.userData.rotSpeed;
            cube.rotation.y += cube.userData.rotSpeed;
            cube.position.y += Math.sin(time + cube.position.x) * 0.002;
        });
        renderer.render(scene, camera);
    }
    animate3D();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // ---------- AIRDROP DATA & STATE ----------
    let airdrops = [
        { id: "1", name: "StellarNet", logo: "https://picsum.photos/id/104/100/100", blockchain: "Solana", difficulty: "Medium", reward: "$1,200+", status: "Live", featured: true, trending: true, createdAt: Date.now() - 86400000 },
        { id: "2", name: "QuantumFi", logo: "https://picsum.photos/id/106/100/100", blockchain: "Ethereum", difficulty: "Hard", reward: "$5,000+", status: "Upcoming", featured: true, trending: false, createdAt: Date.now() - 172800000 },
        { id: "3", name: "Avalanche Peak", logo: "https://picsum.photos/id/95/100/100", blockchain: "Avalanche", difficulty: "Easy", reward: "$300+", status: "Live", featured: false, trending: true, createdAt: Date.now() - 3600000 },
        { id: "4", name: "PolyZen", logo: "https://picsum.photos/id/26/100/100", blockchain: "Polygon", difficulty: "Medium", reward: "$800+", status: "Live", featured: false, trending: false, createdAt: Date.now() - 200000 },
        { id: "5", name: "BNB Galaxy", logo: "https://picsum.photos/id/20/100/100", blockchain: "BNB Chain", difficulty: "Easy", reward: "$450+", status: "Ended", featured: false, trending: false, createdAt: Date.now() - 5000000 },
        { id: "6", name: "SolanaPrime", logo: "https://picsum.photos/id/29/100/100", blockchain: "Solana", difficulty: "Medium", reward: "$2k+", status: "Upcoming", featured: true, trending: false, createdAt: Date.now() - 100000 }
    ];
    let bookmarkedIds = new Set(JSON.parse(localStorage.getItem("bookmarks") || "[]"));
    let editingId = null;
    let newAirdropCount = 0;
    
    function saveBookmarks() { localStorage.setItem("bookmarks", JSON.stringify([...bookmarkedIds])); }
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = `<i class="fas fa-bolt"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function renderAll() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const chainVal = document.getElementById('blockchainFilter').value;
        const diffVal = document.getElementById('difficultyFilter').value;
        let filtered = airdrops.filter(a => 
            (chainVal === 'all' || a.blockchain === chainVal) &&
            (diffVal === 'all' || a.difficulty === diffVal) &&
            (a.name.toLowerCase().includes(searchTerm) || searchTerm === "")
        );
        const sortedByDate = [...filtered].sort((a,b)=>b.createdAt - a.createdAt);
        const latest = sortedByDate.slice(0, 3);
        const trending = filtered.filter(a=>a.trending===true).slice(0,2);
        const featured = filtered.filter(a=>a.featured===true).slice(0,3);
        renderCards('latestContainer', latest);
        renderCards('trendingContainer', trending);
        renderCards('featuredContainer', featured);
        renderCards('allAirdropsContainer', filtered);
    }
    
    function renderCards(containerId, items) {
        const container = document.getElementById(containerId);
        if(!container) return;
        if(items.length===0) { container.innerHTML = `<div style="padding:2rem; text-align:center;">✨ No airdrops found ✨</div>`; return; }
        container.innerHTML = items.map(airdrop => `
            <div class="airdrop-card" data-id="${airdrop.id}">
                ${airdrop.featured ? '<div class="featured-badge"><i class="fas fa-star"></i> Featured</div>' : ''}
                <div class="card-header">
                    <img src="${airdrop.logo}" onerror="this.src='https://picsum.photos/id/1/100/100'">
                    <div><div class="project-name">${airdrop.name}</div><span class="blockchain-badge"><i class="fas fa-link"></i> ${airdrop.blockchain}</span></div>
                </div>
                <div class="info-row"><span class="difficulty"><i class="fas fa-chart-simple"></i> ${airdrop.difficulty}</span><span class="reward"><i class="fas fa-coins"></i> ${airdrop.reward}</span></div>
                <div><span class="status ${airdrop.status}">${airdrop.status}</span></div>
                <div class="card-actions">
                    <button class="join-btn" data-id="${airdrop.id}" data-link="#">Join Airdrop</button>
                    <div class="bookmark ${bookmarkedIds.has(airdrop.id) ? 'active' : ''}" data-id="${airdrop.id}"><i class="fa-${bookmarkedIds.has(airdrop.id) ? 'solid' : 'regular'} fa-bookmark"></i></div>
                </div>
            </div>
        `).join('');
        // attach event listeners dynamically
        document.querySelectorAll(`#${containerId} .join-btn`).forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); showToast("🚀 Redirect to airdrop page (demo)"); });
        });
        document.querySelectorAll(`#${containerId} .bookmark`).forEach(bm => {
            bm.addEventListener('click', (e) => { e.stopPropagation(); const id = bm.dataset.id; if(bookmarkedIds.has(id)) bookmarkedIds.delete(id); else bookmarkedIds.add(id); saveBookmarks(); renderAll(); showToast(bookmarkedIds.has(id) ? "Bookmarked ✓" : "Removed bookmark"); });
        });
    }
    
    // admin open
    const modal = document.getElementById('adminModal');
    document.getElementById('openAdminBtn').onclick = () => { editingId = null; document.getElementById('adminProjectName').value = ''; document.getElementById('adminLogoUrl').value = ''; modal.style.display = 'flex'; };
    document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
    document.getElementById('saveAirdropBtn').onclick = () => {
        const name = document.getElementById('adminProjectName').value.trim();
        const logo = document.getElementById('adminLogoUrl').value.trim() || "https://picsum.photos/id/42/100/100";
        const blockchain = document.getElementById('adminBlockchain').value;
        const difficulty = document.getElementById('adminDifficulty').value;
        const reward = document.getElementById('adminReward').value.trim() || "$???";
        const status = document.getElementById('adminStatus').value;
        if(!name) { showToast("Project name required"); return; }
        if(editingId) {
            const index = airdrops.findIndex(a=>a.id === editingId);
            if(index!==-1) {
                airdrops[index] = {...airdrops[index], name, logo, blockchain, difficulty, reward, status };
                showToast(`Updated ${name}`);
            }
        } else {
            const newId = Date.now().toString();
            airdrops.push({ id: newId, name, logo, blockchain, difficulty, reward, status, featured: false, trending: false, createdAt: Date.now() });
            newAirdropCount++;
            document.getElementById('newNotifCount').innerText = newAirdropCount;
            showToast(`➕ New airdrop: ${name} added!`);
        }
        modal.style.display = 'none';
        renderAll();
    };
    // click on card to edit (admin feature)
    function delegateCardEdit() {
        document.querySelectorAll('.airdrop-card').forEach(card => {
            card.removeEventListener('dblclick', card._dbListener);
            const listener = () => {
                const id = card.dataset.id;
                const a = airdrops.find(x=>x.id===id);
                if(a) {
                    editingId = id;
                    document.getElementById('adminProjectName').value = a.name;
                    document.getElementById('adminLogoUrl').value = a.logo;
                    document.getElementById('adminBlockchain').value = a.blockchain;
                    document.getElementById('adminDifficulty').value = a.difficulty;
                    document.getElementById('adminReward').value = a.reward;
                    document.getElementById('adminStatus').value = a.status;
                    modal.style.display = 'flex';
                }
            };
            card.addEventListener('dblclick', listener);
            card._dbListener = listener;
        });
    }
    // observe re-renders
    const observer = new MutationObserver(() => delegateCardEdit());
    observer.observe(document.getElementById('allAirdropsContainer'), { childList: true, subtree: true });
    observer.observe(document.getElementById('latestContainer'), { childList: true, subtree: true });
    observer.observe(document.getElementById('trendingContainer'), { childList: true, subtree: true });
    observer.observe(document.getElementById('featuredContainer'), { childList: true, subtree: true });
    
    // notify new airdrops
    document.getElementById('notifyBell').onclick = () => { if(newAirdropCount>0) showToast(`✨ ${newAirdropCount} new airdrops available!`); newAirdropCount=0; document.getElementById('newNotifCount').innerText='0'; };
    
    document.getElementById('searchInput').addEventListener('input', () => renderAll());
    document.getElementById('blockchainFilter').addEventListener('change', () => renderAll());
    document.getElementById('difficultyFilter').addEventListener('change', () => renderAll());
    
    renderAll();
    delegateCardEdit();
    // initial notification count
    setInterval(() => {
        // simulate occasional new airdrop hint? not needed, but admin adds new ones.
    }, 5000);
</script>
</body>
</html>
