<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAC Studio - Token & NFT Creator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 100%);
    color: #e0f0ff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .header {
    text-align: center;
    padding: 40px 0;
    border-bottom: 1px solid #2a2a60;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 2.5em;
    background: linear-gradient(135deg, #00d4ff, #7b5ea7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .wallet-section {
    background: rgba(21,21,53,0.8);
    border: 1px solid #2a2a60;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
  }
  .wallet-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
  }
  button {
    background: linear-gradient(135deg, #00d4ff, #7b5ea7);
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }
  .tab-btn {
    flex: 1;
    background: #151535;
    border: 1px solid #2a2a60;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.3s;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #00d4ff, #7b5ea7);
    border-color: transparent;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: rgba(21,21,53,0.8);
    border: 1px solid #2a2a60;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
  }
  .card h3 {
    color: #00d4ff;
    margin-bottom: 20px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    color: #6a6a9a;
    font-size: 12px;
    text-transform: uppercase;
  }
  input, textarea {
    width: 100%;
    padding: 12px;
    background: #0a0a1a;
    border: 1px solid #2a2a60;
    border-radius: 8px;
    color: #e0f0ff;
    font-size: 14px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #00d4ff;
  }
  .network-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 15px;
    padding: 15px;
    background: rgba(0,212,255,0.05);
    border-radius: 10px;
  }
  .result {
    background: #0a0a1a;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    display: none;
    word-break: break-all;
  }
  .result.show { display: block; }
  .success { color: #00ff9d; }
  .error { color: #ff4466; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #151535;
    border: 1px solid #2a2a60;
    border-radius: 10px;
    padding: 12px 20px;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: #00ff9d; color: #00ff9d; }
  .toast.error { border-color: #ff4466; color: #ff4466; }
  @media (max-width: 600px) {
    .network-info { grid-template-columns: 1fr; }
    .wallet-info { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚀 DAC Studio</h1>
    <p>Create ERC-20 Tokens & NFT Collections on DAC Testnet</p>
  </div>

  <div class="wallet-section">
    <div class="wallet-info">
      <div>
        <div id="walletStatus">⚫ Not Connected</div>
        <div id="walletAddress" style="font-size: 12px; color: #6a6a9a;"></div>
      </div>
      <button id="connectBtn">🔌 Connect Wallet</button>
    </div>
    <div class="network-info">
      <div>🌐 Network: DAC Testnet</div>
      <div>🔢 Chain ID: 21894</div>
      <div>💰 Currency: DACC</div>
      <div>⛽ Gas Token: DACC</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('token')">🪙 ERC-20 Token</div>
    <div class="tab-btn" onclick="switchTab('nft')">🎨 NFT Collection</div>
  </div>

  <!-- Token Panel -->
  <div id="tokenPanel" class="panel active">
    <div class="card">
      <h3>📝 Token Details</h3>
      <div class="form-group">
        <label>Token Name *</label>
        <input type="text" id="tokenName" placeholder="e.g., My DAC Token">
      </div>
      <div class="form-group">
        <label>Token Symbol *</label>
        <input type="text" id="tokenSymbol" placeholder="e.g., MDT">
      </div>
      <div class="form-group">
        <label>Decimals</label>
        <input type="number" id="tokenDecimals" value="18">
      </div>
      <div class="form-group">
        <label>Total Supply *</label>
        <input type="text" id="tokenSupply" placeholder="e.g., 1000000">
      </div>
    </div>
    <div id="tokenResult" class="result"></div>
    <button id="deployTokenBtn" onclick="deployToken()" style="width: 100%;">⚡ Deploy ERC-20 Token</button>
  </div>

  <!-- NFT Panel -->
  <div id="nftPanel" class="panel">
    <div class="card">
      <h3>🎨 NFT Collection Details</h3>
      <div class="form-group">
        <label>Collection Name *</label>
        <input type="text" id="nftName" placeholder="e.g., My NFT Collection">
      </div>
      <div class="form-group">
        <label>Symbol *</label>
        <input type="text" id="nftSymbol" placeholder="e.g., MNFT">
      </div>
      <div class="form-group">
        <label>Max Supply</label>
        <input type="number" id="nftMaxSupply" value="10000">
      </div>
      <div class="form-group">
        <label>Base URI (metadata URL)</label>
        <input type="text" id="nftBaseURI" placeholder="ipfs://... or https://...">
      </div>
    </div>
    <div id="nftResult" class="result"></div>
    <button id="deployNFTBtn" onclick="deployNFT()" style="width: 100%;">🎨 Deploy NFT Collection</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
  // DAC Testnet Configuration
  const DAC_CHAIN = {
    chainId: '0x5586',
    chainName: 'DAC Testnet',
    rpcUrls: ['https://rpctest.dachain.tech'],
    nativeCurrency: { name: 'DAC Coin', symbol: 'DACC', decimals: 18 }
  };

  let provider, signer, userAddress;

  // Connect Wallet
  async function connectWallet() {
    if (!window.ethereum) {
      showToast('Please install MetaMask!', 'error');
      return;
    }
    
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      userAddress = accounts[0];
      
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      
      // Switch to DAC network
      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: DAC_CHAIN.chainId }]
        });
      } catch(e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [DAC_CHAIN]
          });
        }
      }
      
      const balance = await provider.getBalance(userAddress);
      document.getElementById('walletStatus').innerHTML = '🟢 Connected';
      document.getElementById('walletAddress').innerHTML = `${userAddress.slice(0,6)}...${userAddress.slice(-4)} | ${parseFloat(ethers.formatEther(balance)).toFixed(4)} DACC`;
      document.getElementById('connectBtn').innerHTML = '✓ Connected';
      document.getElementById('connectBtn').disabled = true;
      
      showToast('Wallet connected to DAC Testnet!', 'success');
    } catch(error) {
      showToast('Connection failed: ' + error.message, 'error');
    }
  }

  // Tab switching
  function switchTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    if (tab === 'token') {
      document.getElementById('tokenPanel').classList.add('active');
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
    } else {
      document.getElementById('nftPanel').classList.add('active');
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
  }

  // Simple ERC-20 Contract Bytecode (Working)
  const SIMPLE_ERC20_BYTECODE = "0x608060405234801561001057600080fd5b50604051610eac380380610eac83398101604081905261002f916101b3565b81516100429060039060208501906100d0565b5080516100569060049060208401906100d0565b506005805460ff191660ff83161790556006819055604080518481526020810184905233917fddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef910160405180910390a350505061029c565b8280546100bc90610227565b90600052602060002090601f0160209004810192826100de5760008555610124565b82601f106100f757805160ff1916838001178555610124565b82800160010185558215610124579182015b82811115610123578251825591602001919060010190610109565b5b5090506101319190610135565b5090565b5b808211156101315760008155600101610136565b6000601f838184011261015b57600080fd5b825167ffffffffffffffff8082111561017657610175610261565b5b610188601f83601f1601602001610266565b9150818185526020860193508285880184890111156101a657600080fd5b600092505b838310156101a857835183820152928101926001810191506101ab565b508094505050505092915050565b600080600080608085870312156101c957600080fd5b845167ffffffffffffffff8111156101e057600080fd5b6101ec8782880161014a565b945050602085015167ffffffffffffffff81111561020957600080fd5b6102158782880161014a565b935050604085015160ff8116811461022c57600080fd5b6060959095015193969295505050565b600181811c9082168061025057607f821691505b60208210810361025b57634e487b7160e01b600052602260045260246000fd5b50919050565b634e487b7160e01b600052604160045260246000fd5b601f01601f191690565b604051601f8201601f1916810167ffffffffffffffff811182821017156102ac576102ac610261565b604052919050565b610c01806102b26000396000f3fe608060405234801561001057600080fd5b50600436106100a95760003560e01c80633950935111610071578063395093511461016857806370a082311461018457806395d89b41146101ba578063a9059cbb146101d8578063dd62ed3e14610208578063f2fde38b14610238576100a9565b806306fdde03146100ae578063095ea7b3146100cc57806318160ddd146100fc57806323b872dd1461011a578063313ce5671461014a575b600080fd5b6100b6610254565b6040516100c391906108aa565b60405180910390f35b6100e660048036038101906100e1919 f16815260200190815260200160002054905092915050565b6104ee610668565b73ffffffffffffffffffffffffffffffffffffffff16600760009054906101000a900473ffffffffffffffffffffffffffffffffffffffff1673ffffffffffffffffffffffffffffffffffffffff161461057d576040517f08c379a000000000000000000000000000000000000000000000000000000000815260040161057490610bae565b60405180910390fd5b600073ffffffffffffffffffffffffffffffffffffffff168173ffffffffffffffffffffffffffffffffffffffff16036105ec576040517f08c379a00000000000000000000000000000000000000000000000000000000081526004016105e390610c40565b60405180910390fd5b80600760006101000a81548173ffffffffffffffffffffffffffffffffffffffff021916908373ffffffffffffffffffffffffffffffffffffffff1602179055508073ffffffffffffffffffffffffffffffffffffffff1661064c610668565b73ffffffffffffffffffffffffffffffffffffffff167f8be0079c531659141344cd1fd0a4f28419497f9722a3daafe3b4186f6b6457e060405160405180910390a350565b600033905090565b600073ffffffffffffffffffffffffffffffffffffffff168373ffffffffffffffffffffffffffffffffffffffff16036106df576040517f08c379a00000000000000000000000000000000000000000000000000000000081526004016106d690610cd2565b60405180910390fd5b600073ffffffffffffffffffffffffffffffffffffffff168273ffffffffffffffffffffffffffffffffffffffff160361074e576040517f08c379a000000000000000000000000000000000000000000000000000000000815260040161074590610d64565b60405180910390fd5b806002600061075b610668565b73ffffffffffffffffffffffffffffffffffffffff1673ffffffffffffffffffffffffffffffffffffffff16815260200190815260200160002060008573ffffffffffffffffffffffffffffffffffffffff1673ffffffffffffffffffffffffffffffffffffffff168152602001908152602001600020819055508173ffffffffffffffffffffffffffffffffffffffff166107f4610668565b73ffffffffffffffffffffffffffffffffffffffff167f8c5be1e5ebec7d5bd14f71427d1e84f3dd0314c0f7b2291e5b200ac8c7c3b9258360405161082691906109ea565b60405180910390a3505050565b600061083f8484610a3b565b610847610668565b73ffffffffffffffffffffffffffffffffffffffff168473ffffffffffffffffffffffffffffffffffffffff16146108a95   const ERC20_ABI = [
    "constructor(string name, string symbol, uint8 decimals, uint256 totalSupply)",
    "function name() view returns (string)",
    "function symbol() view returns (string)",
    "function decimals() view returns (uint8)",
    "function totalSupply() view returns (uint256)",
    "function balanceOf(address) view returns (uint256)",
    "function transfer(address to, uint256 amount) returns (bool)"
  ];

  async function deployToken() {
    const name = document.getElementById('tokenName').value.trim();
    const symbol = document.getElementById('tokenSymbol').value.trim();
    const decimals = parseInt(document.getElementById('tokenDecimals').value) || 18;
    const supply = document.getElementById('tokenSupply').value.trim();
    
    if (!name || !symbol || !supply) {
      showToast('Please fill all fields', 'error');
      return;
    }
    
    if (!userAddress) {
      showToast('Please connect wallet first', 'error');
      return;
    }
    
    const btn = document.getElementById('deployTokenBtn');
    btn.disabled = true;
    btn.innerHTML = '⏳ Deploying...';
    
    try {
      const supplyWei = ethers.parseUnits(supply, decimals);
      
      const factory = new ethers.ContractFactory(ERC20_ABI, SIMPLE_ERC20_BYTECODE, signer);
      const contract = await factory.deploy(name, symbol, decimals, supplyWei);
      
      showToast('Transaction submitted! Waiting for confirmation...', 'success');
      
      const receipt = await contract.deploymentTransaction().wait();
      const contractAddress = await contract.getAddress();
      
      const resultDiv = document.getElementById('tokenResult');
      resultDiv.classList.add('show');
      resultDiv.innerHTML = `
        <div class="success">✅ Token Deployed Successfully!</div>
        <div><strong>Contract Address:</strong><br>${contractAddress}</div>
        <div style="margin-top: 10px;"><strong>Transaction:</strong><br>${receipt.hash}</div>
        <button onclick="navigator.clipboard.writeText('${contractAddress}')" style="margin-top: 10px; background: #2a2a60;">📋 Copy Address</button>
      `;
      
      showToast('Token deployed successfully!', 'success');
    } catch (error) {
      console.error(error);
      showToast('Deploy failed: ' + (error.reason || error.message || 'Check your balance'), 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '⚡ Deploy ERC-20 Token';
    }

  const ERC721_ABI = [
    "constructor(string name, string symbol, uint256 maxSupply, uint256 mintPrice, string baseURI)",
    "function name() view returns (string)",
    "function symbol() view returns (string)",
    "function totalSupply() view returns (uint256)",
    "function maxSupply() view returns (uint256)"
  ];

  async function deployNFT() {
    const name = document.getElementById('nftName').value.trim();
    const symbol = document.getElementById('nftSymbol').value.trim();
    const maxSupply = parseInt(document.getElementById('nftMaxSupply').value) || 10000;
    const baseURI = document.getElementById('nftBaseURI').value.trim() || "https://api.example.com/metadata/";
    
    if (!name || !symbol) {
      showToast('Please fill collection name and symbol', 'error');
      return;
    }
    
    if (!userAddress) {
      showToast('Please connect wallet first', 'error');
      return;
    }
    
    const btn = document.getElementById('deployNFTBtn');
    btn.disabled = true;
    btn.innerHTML = '⏳ Deploying NFT...';
    
    try {
      const mintPrice = ethers.parseEther("0");
      
      const factory = new ethers.ContractFactory(ERC721_ABI, SIMPLE_ERC721_BYTECODE, signer);
      const contract = await factory.deploy(name, symbol, maxSupply, mintPrice, baseURI);
      
      showToast('Transaction submitted! Waiting for confirmation...', 'success');
      
      const receipt = await contract.deploymentTransaction().wait();
      const contractAddress = await contract.getAddress();
      
      const resultDiv = document.getElementById('nftResult');
      resultDiv.classList.add('show');
      resultDiv.innerHTML = `
        <div class="success">✅ NFT Collection Deployed Successfully!</div>
        <div><strong>Contract Address:</strong><br>${contractAddress}</div>
        <div style="margin-top: 10px;"><strong>Transaction:</strong><br>${receipt.hash}</div>
        <button onclick="navigator.clipboard.writeText('${contractAddress}')" style="margin-top: 10px; background: #2a2a60;">📋 Copy Address</button>
      `;
      
      showToast('NFT Collection deployed successfully!', 'success');
    } catch (error) {
      console.error(error);
      showToast('Deploy failed: ' + (error.reason || error.message || 'Check your balance'), 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🎨 Deploy NFT Collection';
    }
  }

  function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast show ${type}`;
    setTimeout(() => {
      toast.classList.remove('show');
    }, 4000);
  }

  document.getElementById('connectBtn').onclick = connectWallet;
