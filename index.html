<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Calculator</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f172a,#000);
font-family:system-ui;
}

.calculator{
width:320px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border-radius:20px;
padding:15px;
color:white;
box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.display{
font-size:32px;
padding:15px;
text-align:right;
background:rgba(0,0,0,0.3);
border-radius:15px;
margin-bottom:10px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
animation:fadeIn .4s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

button{
height:55px;
border:none;
border-radius:15px;
background:rgba(255,255,255,0.1);
color:white;
font-size:18px;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

.equal{
background:white;
color:black;
}

.history{
margin-top:10px;
font-size:12px;
opacity:.7;
}

.toggle{
position:absolute;
top:20px;
right:20px;
}

.dark{
background:linear-gradient(135deg,#fff,#ddd);
color:black;
}

</style>
</head>

<body>

<button class="toggle" onclick="toggleTheme()">🌙</button>

<div class="calculator">

<div id="display" class="display">0</div>

<div class="grid">
<button onclick="clearAll()">AC</button>
<button onclick="operator('/')">÷</button>
<button onclick="operator('*')">×</button>
<button onclick="memoryRecall()">MR</button>

<button onclick="press(7)">7</button>
<button onclick="press(8)">8</button>
<button onclick="press(9)">9</button>
<button onclick="operator('-')">−</button>

<button onclick="press(4)">4</button>
<button onclick="press(5)">5</button>
<button onclick="press(6)">6</button>
<button onclick="operator('+')">+</button>

<button onclick="press(1)">1</button>
<button onclick="press(2)">2</button>
<button onclick="press(3)">3</button>
<button onclick="calculate()" class="equal">=</button>

<button onclick="press(0)">0</button>
<button onclick="press('.')">.</button>
<button onclick="memoryAdd()">M+</button>
<button onclick="memoryMinus()">M-</button>
</div>

<div class="history" id="history"></div>

</div>

<script>

let display="0"
let prev=null
let op=null
let memory=0
let history=[]

function update(){
document.getElementById("display").innerText=display
}

function press(n){
play()
display=display=="0"?n:display+n
update()
}

function operator(o){
prev=display
op=o
display="0"
}

function calculate(){
if(!prev||!op) return

let a=parseFloat(prev)
let b=parseFloat(display)
let r=0

if(op=="+") r=a+b
if(op=="-") r=a-b
if(op=="*") r=a*b
if(op=="/") r=a/b

history.unshift(`${a} ${op} ${b} = ${r}`)
history=history.slice(0,5)

display=r.toString()
update()

renderHistory()
}

function clearAll(){
display="0"
update()
}

function renderHistory(){
document.getElementById("history").innerHTML=
 history.map(h=>`<div>${h}</div>`).join("")
}

function toggleTheme(){
document.body.classList.toggle("dark")
}

function play(){
new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3").play()
}

function memoryAdd(){
memory+=parseFloat(display)
}

function memoryMinus(){
memory-=parseFloat(display)
}

function memoryRecall(){
display=memory.toString()
update()
}

// keyboard

document.addEventListener("keydown",e=>{
if(!isNaN(e.key)) press(e.key)
if(["+","-","*","/"].includes(e.key)) operator(e.key)
if(e.key==="Enter") calculate()
})

// swipe

let start=0

document.addEventListener("touchstart",e=>{
start=e.touches[0].clientY
})

document.addEventListener("touchmove",e=>{
let diff=start-e.touches[0].clientY
if(diff>60) clearAll()
})

</script>

</body>
</html>
